# One host. docker-stack.yml is the Swarm deployment.
services:
  frontend:
    image: ${CRIMSON_IMAGE:-crimson-client:local}
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_SITE_URL: ${VITE_SITE_URL:-}
        VITE_HOSTED_IN: ${VITE_HOSTED_IN:-}
        VITE_DMCA_MAIL: ${VITE_DMCA_MAIL:-}
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
