# Swarm stack, for reference. The live copies are on the manager and CI never ships
# this file (see .gitlab-ci.yml).
#
#   CRIMSON_IMAGE=<registry>/crimson-client:<tag> PUBLISHED_PORT=8800 \
#   docker stack deploy --with-registry-auth -c docker-stack.yml crimson-client
#
# The image is static nginx with everything baked in at build time, so there are no
# runtime secrets. --with-registry-auth lets every node pull a private image, now and
# after a reschedule.
version: "3.8"

services:
  frontend:
    image: ${CRIMSON_IMAGE:?set CRIMSON_IMAGE to the image to deploy}
    ports:
      # Point the TLS reverse proxy at this port.
      - target: 80
        published: ${PUBLISHED_PORT:-8080}
        protocol: tcp
        mode: ingress

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    stop_grace_period: 20s

    deploy:
      mode: replicated
      replicas: 3

      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 30s

      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0.3

      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first

      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

      placement:
        max_replicas_per_node: 2

    networks:
      - crimson_net

networks:
  crimson_net:
    driver: overlay
    attachable: true
