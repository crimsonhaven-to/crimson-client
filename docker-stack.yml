# Production Swarm stack, rolled by CI on release. The image is private, so it is
# deployed with --with-registry-auth, and the stack name must stay crimson-client.
version: "3.8"

services:
  frontend:
    image: ${CRIMSON_IMAGE:-registry.ramon.moe/crimsonhaven-to/crimson-client:latest}
    ports:
      # Must match the port the TLS reverse proxy forwards to.
      - target: 80
        published: 8800
        protocol: tcp
        mode: ingress

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    stop_grace_period: 20s

    deploy:
      mode: replicated
      replicas: 3

      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 30s

      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0.3

      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first

      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

      placement:
        max_replicas_per_node: 2

    networks:
      - crimson_net

networks:
  crimson_net:
    driver: overlay
    attachable: true
