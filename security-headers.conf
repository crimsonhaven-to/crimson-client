# Included from every location in nginx.conf. `always` also sends them on errors.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# script-src is the real XSS floor: 'self' plus the hash of index.html's only inline
# script, the theme guard. Change that script at all, even whitespace, and the hash
# must be recomputed or the guard is silently blocked:
#   node -e "const c=require('crypto'),m=require('fs').readFileSync('index.html','utf8').replace(/\r\n/g,'\n').match(/<script>([\s\S]*?)<\/script>/);console.log('sha256-'+c.createHash('sha256').update(m[1]).digest('base64'))"
# Cloudflare's injected bot-detection snippet stays blocked; that is harmless.
#
# Where cross-origin is allowed, and why:
#   img-src https: data:   posters and covers come from many CDNs.
#   img-src blob:          posters of offline downloads, read from Cache Storage.
#   connect-src https:     client-resolved sources play straight from hoster CDNs
#                          that rotate and cannot be enumerated.
#   connect-src ws://127.0.0.1:* ws://localhost:*
#                          Discord Rich Presence talks to the desktop client's
#                          loopback RPC server, which has no TLS. Loopback is exempt
#                          from upgrade-insecure-requests.
#   frame-src https:       third-party embed players.
#   media-src blob:        hls.js feeds <video> through MediaSource, and offline mp4
#                          downloads and their subtitles play from object URLs. The
#                          hls.js worker is disabled so worker-src needs no blob:.
#   style-src 'unsafe-inline'
#                          React inline styles and Tailwind; nonces are not worth it
#                          for a style-only vector.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'sha256-pQwnCJLuKrqlsvT0kz9fkTRQyx2kl1ErwVPWlvO9r6E='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' https: blob:; connect-src 'self' https: ws://127.0.0.1:* ws://localhost:*; frame-src https:; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests" always;
