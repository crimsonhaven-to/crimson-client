# A push to main builds :dev-<sha> and rolls the dev stack. A v* tag, or a run with
# CHANNEL=prod (manual, or triggered by crimson-sources), builds an immutable tag
# and rolls production. A v* tag or a manual run also publishes the Pages demo.
#
# VITE_API_BASE_URL is baked in at build time, so each channel builds its own
# image. crimson-sources is fetched from main for every channel; a release pins it
# by baking it into the immutable image. The fetch needs this project on
# crimson-sources' job token allowlist; if it fails, the build still succeeds with
# the no-op stub and plays through the backend only.
#
# Deploys only run deploy.sh on the manager. The stack files there
# (~/crimson-client-deploy, ~/dev-crimson-client-deploy) are edited in place; the
# one in this repo is a reference and never shipped.
#
# build and deploy run on `crimsonrunner`, the shell runner on server10 with
# buildx and SSH to the managers. Swarm nodes pull the private image with the
# managers' read_registry token, shipped by --with-registry-auth.

stages:
  - security
  - gate
  - build
  - deploy
  - pages

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  SWARM_MANAGER: raymond@crimsonswarm01
  CHANNEL:
    value: "dev"
    description: "Target channel: dev rolls the dev stack; prod auto-deploys to the prod swarm."

default:
  interruptible: false

.prod_trigger:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "pipeline") && $CHANNEL == "prod"

# A CHANNEL=prod trigger also runs on main, so without the exclusion it would roll
# the dev stack alongside prod.
.dev_trigger:
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CHANNEL != "prod"
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "pipeline") && $CHANNEL != "prod"

.any_trigger:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "pipeline"

gate:
  extends: .any_trigger
  stage: gate
  tags: [docker]
  image: node:24-slim
  script:
    - npm ci
    - npm run lint
    - npm test

build:
  extends: .any_trigger
  stage: build
  tags: [crimsonrunner]
  needs: [gate]
  resource_group: crimson-client-$CI_COMMIT_REF_NAME
  variables:
    CRIMSON_SOURCES_REPO: "crimsonhaven-to/crimson-sources"
  before_script:
    # network=host so BuildKit reads /etc/hosts and pushes to the registry over the
    # LAN. Through public DNS it hits the Cloudflare Tunnel, whose 100MB body cap
    # rejects large layers with a 413.
    - docker buildx create --name crimson --driver docker-container --driver-opt network=host 2>/dev/null || true
    - docker buildx use crimson
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      set -u
      if [ -n "${CI_COMMIT_TAG:-}" ] || [ "${CHANNEL:-dev}" = "prod" ]; then
        BUILD_CHANNEL=prod
      else
        BUILD_CHANNEL=dev
      fi
      SOURCES_BRANCH=main
      echo "channel=${BUILD_CHANNEL} sources=${SOURCES_BRANCH}"

      # Any failure leaves <dest> empty instead of failing the job, so a build
      # without access to the sources still ships.
      fetch() {  # <repo slug or empty> <branch> <dest>
        repo="$1"; branch="$2"; dest="$3"
        rm -rf "$dest"
        if [ -z "$repo" ]; then
          mkdir -p "$dest"
          echo "no repo configured for ${dest}, building without it"
          return 0
        fi
        url="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${repo}.git"
        echo "Fetching ${repo}@${branch} -> ${dest}"
        if git clone --depth 1 --branch "$branch" "$url" "$dest"; then
          ok=1
        else
          rm -rf "$dest"
          if git clone --depth 1 "$url" "$dest"; then ok=1; else ok=0; fi
        fi
        if [ "$ok" = 1 ]; then
          rm -rf "$dest/.git"
          echo "${repo} bundled"
        else
          rm -rf "$dest"; mkdir -p "$dest"
          echo "could not fetch ${repo} (no access or not found), building without it"
        fi
      }
      fetch "${CRIMSON_SOURCES_REPO:-}" "$SOURCES_BRANCH" vendor/crimson-sources

      if [ "$BUILD_CHANNEL" = "prod" ]; then
        if [ -n "${CI_COMMIT_TAG:-}" ]; then
          VER="$CI_COMMIT_TAG"
          if ! printf '%s' "$VER" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "Refusing to build/deploy an unsafe release tag: '$VER'" >&2
            exit 1
          fi
        else
          VER="main-$(git rev-parse --short HEAD)"
        fi
        TAGS="--tag ${IMAGE}:${VER} --tag ${IMAGE}:latest"
        API_URL="https://backend.crimsonhaven.to"
        SITE_URL="https://crimsonhaven.to"
        {
          echo "VERSION=${VER}"
          echo "DEPLOY=true"
          echo "BUILD_CHANNEL=prod"
          echo "IMAGE_TAG=${VER}"
        } >> build.env
      else
        SHORT_SHA="$(git rev-parse --short HEAD)"
        TAGS="--tag ${IMAGE}:dev --tag ${IMAGE}:dev-${SHORT_SHA}"
        API_URL="https://dev-backend.crimsonhaven.to"
        SITE_URL="https://dev.crimsonhaven.to"
        {
          echo "VERSION="
          echo "DEPLOY=false"
          echo "BUILD_CHANNEL=dev"
          # Not the rolling :dev, so the stack rolls to exactly this build.
          echo "IMAGE_TAG=dev-${SHORT_SHA}"
        } >> build.env
      fi

      docker buildx build \
        --push \
        $TAGS \
        --build-arg "VITE_API_BASE_URL=${API_URL}" \
        --build-arg "VITE_SITE_URL=${SITE_URL}" \
        --build-arg "VITE_HOSTED_IN=${HOSTED_IN:-}" \
        --build-arg "VITE_DMCA_MAIL=${DMCA_MAIL:-}" \
        --cache-from "type=registry,ref=${IMAGE}:buildcache" \
        --cache-to "type=registry,ref=${IMAGE}:buildcache,mode=max" \
        .
  artifacts:
    reports:
      dotenv: build.env

deploy:
  extends: .prod_trigger
  stage: deploy
  tags: [crimsonrunner]
  needs: [build]
  resource_group: crimson-client-prod
  environment:
    name: production
    url: https://crimsonhaven.to
  script:
    # VERSION was validated to a safe charset in build.
    - ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "${SWARM_MANAGER}" "/home/raymond/crimson-client-deploy/deploy.sh '${VERSION}'"

deploy-dev:
  extends: .dev_trigger
  stage: deploy
  tags: [crimsonrunner]
  needs: [build]
  resource_group: crimson-client-dev
  environment:
    name: dev
    url: https://dev.crimsonhaven.to
  script:
    - ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "${SWARM_MANAGER}" "/home/raymond/dev-crimson-client-deploy/deploy.sh '${IMAGE_TAG}'"

# The demo at demo.crimsonhaven.org is sourceless on purpose, like its backend: no
# crimson-sources fetch, so it shows the UI and accounts but never a stream.
pages:
  stage: pages
  tags: [docker]
  image: node:24
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"
  resource_group: pages-demo
  variables:
    VITE_API_BASE_URL: https://demo-backend.crimsonhaven.to
    VITE_SITE_URL: https://demo.crimsonhaven.org
  script:
    - npm ci
    - npm run build
    # Pages has no SPA rewrite, so deep links reach the app through 404.html.
    - cp dist/index.html dist/404.html
    - rm -rf public && mv dist public
  artifacts:
    paths:
      - public

# GitLab's Dependency Scanning is Ultimate-only and silently scans nothing on CE.
# The first pass records every severity; only HIGH and CRITICAL block. The lockfile
# is scanned, not the image, because base-image OS findings would wedge deploys.
scan-deps:
  stage: security
  tags: [docker]
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/
  variables:
    TRIVY_CACHE_DIR: .trivycache
    TRIVY_NO_PROGRESS: "true"
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  script:
    - trivy fs --scanners vuln --severity LOW,MEDIUM,HIGH,CRITICAL --exit-code 0 .
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 .

# Runs only from a pipeline schedule and skips itself until RENOVATE_TOKEN (a
# group variable, a token with the `api` scope) is set.
renovate:
  stage: security
  tags: [docker]
  image:
    name: renovate/renovate:latest
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_TOKEN
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate@crimsonhaven.to>"
    LOG_LEVEL: info
  script:
    - renovate
